<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>title</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css" rel="stylesheet">
    <style>
      #toast-container.toast-middle-center {
        top: 35%;
        transform: translateY(-70%);
      }
    </style>
    <!-- Jquery min CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>

    <script src="https://code.jquery.com/ui/1.14.1/jquery-ui.min.js" integrity="sha256-AlTido85uXPlSyyaZNsjJXeCs07eSv3r43kyCVc8ChI=" crossorigin="anonymous"></script>
  </head>
  <body>
    <div class = "queston-container"style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 1rem;">
      <h4>물에 빠지면 누구를 먼저 구할 것임?</h4>
      <div class="button-group" style="display: flex; flex-direction: row; gap: 0.5rem;">
        <button class="btn btn-outline-primary" id="wife">와이프</button>
        <button class="btn btn-outline-primary" id="parents">부모님</button>
        <button class="btn btn-outline-primary" id="daughter">딸</button>
        <button class="btn btn-outline-primary" id="puppy">강아지</button>
      </div>
    </div>

    <script>
      const TOAST_CONFIG = {
        positionClass: 'toast-top-center toast-middle-center',
        closeButton: true,
        progressBar: true,
        timeOut: 3000,
        preventDuplicates: true,
        newestOnTop: false,
        autoDismiss: true,
        showMethod: 'slideDown',
        hideMethod: 'slideUp'
      };

      const MESSAGES = {
        wife: '현명하시군요',
        parents: '효자시군요',
        daughter: '딸을 사랑하시는군요',
        puppy: '강아지를 좋아하시는군요'
      };

      $(() => {
        $('.button-group').on('click', 'button', (e) => {
          const buttonId = e.target.id;
          if (MESSAGES[buttonId]) {
            toastr.warning(MESSAGES[buttonId], '메시지', TOAST_CONFIG);
          }
        });
        $('h4').animate({fontSize : '40px'},2000,'easeOutBounce').animate({fontSize:'24px'},2000,'easeOutBounce');
      });
    </script>
    <!-- Bootstrap JS Bundle (includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>

  </body>
</html>
